<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Testing Guide | Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Software Testing Guide</h1>

        <nav class="nav">
            <a class="nav__link" href="index.html">Home</a>
            <a class="nav__link" href="testing.html">Testing Types</a>
            <a class="nav__link nav__link--active" href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Contact</h2>
    
        <img class="page-image"
             src="images/contact.jpg"
             alt="Software quality assurance and communication">

        <form class="contact-form"
              action="mailto:mandira.ramasinghe98@gmail.com"
              method="post"
              enctype="text/plain">

            <label for="name">Name:</label>
            <input type="text" id="name" name="name">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject">

            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Send Message</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Mandira</p>
    </footer>
    
</body>
</html>
